name: Backend CI

# Deliberately no `paths:` filter on the push trigger: this repository is kept as a
# single root commit that gets amended and force-pushed rather than accumulating
# history, so consecutive pushes never share a common ancestor. GitHub computes
# path-filtered push triggers by diffing the old and new commit, which is undefined
# across unrelated histories — in practice it silently evaluates to "no match" and the
# workflow never fires at all (see android-ci.yml for the same note). Running
# unconditionally on every push is the only trigger that reliably works given that
# convention; a manual workflow_dispatch is also provided as a fallback.

on:
  push:
  pull_request:
  workflow_dispatch:

defaults:
  run:
    working-directory: backend

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Audit (fails on known vulnerabilities)
        run: npm audit --audit-level=moderate

  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: blick_test
          POSTGRES_USER: blick_test
          POSTGRES_PASSWORD: blick_test_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username=blick_test --dbname=blick_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --health-start-period 10s
    env:
      LIVE_COMMUTE_TEST_DATABASE_URL: postgresql://blick_test:blick_test_ci_only@127.0.0.1:5432/blick_test
      LIVE_COMMUTE_MIGRATION_DATABASE_URL: postgresql://blick_test:blick_test_ci_only@127.0.0.1:5432/blick_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Apply live commute migration
        run: npm run migrate:live-commute

      - name: Verify live commute migration is idempotent
        run: npm run migrate:live-commute

      - name: Apply live activity delivery migration
        run: npm run migrate:live-activity-delivery

      - name: Verify live activity delivery migration is idempotent
        run: npm run migrate:live-activity-delivery

      - name: Apply live activity dispatch migration
        run: npm run migrate:live-activity-dispatch

      - name: Verify live activity dispatch migration is idempotent
        run: npm run migrate:live-activity-dispatch

      - name: Apply live activity publication policy migration
        run: npm run migrate:live-activity-publication-policy

      - name: Verify live activity publication policy migration is idempotent
        run: npm run migrate:live-activity-publication-policy

      - name: Test live commute PostgreSQL integration
        run: npm run test:live-commute-postgres

      - name: Test live activity delivery PostgreSQL integration
        run: npm run test:live-activity-postgres
