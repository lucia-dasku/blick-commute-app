name: Android CI

# Validates the committed Gradle wrapper and runs the standard local-verification tasks
# (assembleDebug, lintDebug, testDebugUnitTest) on a real JDK 17 + Android SDK runner.
#
# This workflow has not yet been exercised on GitHub Actions: it was authored and
# structurally reviewed (YAML validity, action versions, task names cross-checked
# against android/app/build.gradle.kts) in an environment with no JDK 17, no Android
# SDK, and no network path to the hosts that would provide either — see
# android/README.md, "Build". Its first real run will be on GitHub's own runners after
# this repository is pushed.
#
# Deliberately no `paths:` filter on the push trigger: this repository is kept as a
# single root commit that gets amended and force-pushed rather than accumulating
# history, so consecutive pushes never share a common ancestor. GitHub computes
# path-filtered push triggers by diffing the old and new commit, which is undefined
# across unrelated histories — in practice it silently evaluates to "no match" and the
# workflow never fires at all. Running unconditionally on every push is the only
# trigger that reliably works given that convention; a manual workflow_dispatch is
# also provided as a fallback.

on:
  push:
  pull_request:
  workflow_dispatch:

defaults:
  run:
    working-directory: android

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: assembleDebug
        run: ./gradlew assembleDebug --stacktrace

      - name: lintDebug
        run: ./gradlew lintDebug --stacktrace

      - name: testDebugUnitTest
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-results
          path: android/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
