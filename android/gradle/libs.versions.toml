[versions]
# Verified current-stable during the 2026-07-28 AGP-9-built-in-Kotlin migration pass —
# see android/README.md. AGP 9.2.1 is the patch release fixing a documented R8
# ClassNotFoundException regression in 9.2.0. Kotlin is pinned to 2.3.10 to match the
# Kotlin version AGP 9.2.x's built-in-Kotlin support bundles by default (per AGP's own
# fixed-issues notes); this matters because the Compose compiler plugin below is
# version-locked 1:1 to the actual Kotlin compiler in use. KSP moved to an independent
# version scheme starting at 2.3.0 (no longer "{kotlinVersion}-{kspVersion}"); 2.3.9 is
# KSP's latest stable release and 2.3.1+ added explicit AGP 9.0/built-in-Kotlin support.
# Hilt/Dagger MUST be 2.59+: the Hilt Gradle plugin has no AGP 9 support at all before
# that release (it fails applying with "Android BaseExtension not found" — see
# github.com/google/dagger/issues/4944 and the Dagger 2.59 release notes, which state
# AGP 9 is now a requirement for the Hilt Gradle plugin as of that version). 2.59.2 is
# pinned specifically since it additionally fixes two more AGP-9-specific bugs found
# after 2.59's initial support landed (a classpath-transform issue and slow incremental
# builds from HiltSyncTask).
agp = "9.2.1"
kotlin = "2.3.10"
billing = "9.1.0"
composeBom = "2026.06.00"
hilt = "2.59.2"
ksp = "2.3.9"

# OkHttp is declared explicitly (not left as a transitive dependency of Retrofit):
# Retrofit's own Gradle module metadata does not expose okhttp3 classes (MediaType,
# etc.) on consumers' compile classpaths, so code that imports them directly — like
# NetworkModule.kt's `toMediaType()` call — needs this declared here. Pinned to 4.12.0,
# the last 4.x release, rather than the current 5.x line: per Retrofit's own changelog,
# Retrofit only upgrades its OkHttp baseline to 4.12 in the unreleased 3.0.0 milestone
# ("Upgrade to OkHttp 4.12 (from 3.14)"), and OkHttp 5.0 (2025-07-02) made real breaking
# changes (split JVM/Android artifacts, non-null Response.body, MockWebServer package
# changes) that Retrofit 2.11.0 was never verified against.
okhttp = "4.12.0"

# Not individually re-verified against the registry at scaffold time; bump via this
# catalog as needed. None of these affect the compileSdk/targetSdk/minSdk decisions,
# which were explicitly verified (see android/README.md).
# coreKtx deliberately bumped ahead of the rest of this block (2026-07-30, Live Update
# milestone): NotificationCompat.Builder.setRequestPromotedOngoing -- required to
# request Android 16's promoted-ongoing-notification ("Live Update") surface -- was
# added in androidx.core 1.17.0-alpha01 and is stable as of 1.17.0 (2025-08-13).
# Deliberately NOT bumped further to the actual latest stable (1.19.0, 2026-06-03):
# that release's own AAR metadata requires compileSdk 37+ (confirmed via a real local
# build failure -- "Dependency 'androidx.core:core:1.19.0' requires ... compile against
# version 37 or later"), one major SDK level ahead of this project's verified compileSdk
# 36 (Android 16, the same OS version this milestone's Live Update feature targets in
# the first place) -- bumping compileSdk itself is out of scope for this milestone.
# 1.17.0 has no such requirement and is the version that actually introduced this API.
coreKtx = "1.17.0"
# Per-app language support milestone -- AppCompatDelegate.setApplicationLocales/
# getApplicationLocales (stable since 1.6.0) is the single source of truth for Blick's
# English/Svenska selection (see locale/AppLocale.kt); 1.7.0 is the most recent release this
# offline environment could confirm resolves against Google's Maven (no newer version was
# reachable to verify here) -- MainActivity itself only needs AppCompatActivity/an
# AppCompat-descended theme for this, no other AppCompat widget/component is used anywhere.
appcompat = "1.7.0"
lifecycle = "2.9.1"
activityCompose = "1.10.1"
navigationCompose = "2.8.9"
room = "2.8.1"
datastore = "1.1.2"
kotlinxSerialization = "1.7.3"
kotlinxCoroutines = "1.9.0"
retrofit = "2.11.0"
# Bumped 2026-08-07 from 2.9.1 to 2.11.1 (NOT the latest stable, 2.11.2 -- see below).
# 2.11.0 raised WorkManager's own minSdk from 21 to 23 -- comfortably below this app's minSdk
# 26 (see the app module's own build.gradle.kts), so no conflict. None of the APIs this
# codebase actually uses (OneTimeWorkRequestBuilder, ExistingWorkPolicy.REPLACE,
# enqueueUniqueWork/cancelUniqueWork/getWorkInfosForUniqueWork, TestListenableWorkerBuilder,
# WorkManagerTestInitHelper) were deprecated or changed across this range -- the new APIs
# added along the way (Flow-based getWorkInfosFlow, getStopReason,
# ExistingPeriodicWorkPolicy.UPDATE) are all periodic-work- or LiveData-migration-focused,
# neither of which this codebase uses (see WorkManagerRoutineScheduler's own doc on why there
# is deliberately no PeriodicWorkRequest anywhere). 2.10.0-alpha03 specifically fixed
# "foreground workers timing out on API 34-35" -- directly relevant to
# RoutineActiveWindowWorker's own long-running foreground execution on this app's targetSdk
# 36. hilt-work below is left unbumped: androidx.hilt 1.2.0's WorkManager integration surface
# (HiltWorker/HiltWorkerFactory) has no version-specific coupling to the work-runtime release
# actually in use, and the build was verified to still resolve/compile/test cleanly against
# it unchanged.
#
# 2.11.2 is deliberately NOT used: on a real device, it broke 38 of the 56
# `connectedDebugAndroidTest` instrumented tests (every Compose-hosted screen test; the two
# Room/DAO-only test files were unaffected) with `IllegalStateException: No compose
# hierarchies found in the app` -- the host Activity launches and draws a frame
# (confirmed via logcat's `reportNextDraw`) but Compose's test-hierarchy registration then
# times out after a consistent ~4.2s on every single affected test, so this is a test-harness
# synchronization failure, not an app crash (no FATAL EXCEPTION anywhere in logcat) and not
# WorkManager's own scheduling machinery running slow (zero "WM-"-tagged log lines from
# Blick's own process the whole run). Confirmed via a clean before/after A/B run (2.9.1: 56/56
# pass; 2.11.2: 38/56 fail, reproduced twice) that this is a genuine regression from the
# version bump, not pre-existing device/environment flakiness, and via bisection across every
# intermediate stable release (2.10.0: 56/56 pass; 2.11.0: 56/56 pass; 2.11.1: 56/56 pass;
# 2.11.2: 38/56 fail) that it is isolated to the single 2.11.1 -> 2.11.2 patch bump. Ruled out
# as causes: manifest merging (androidx.work.WorkManagerInitializer is still correctly
# REJECTED at 2.11.2 per the real manifest-merger-debug-report.txt), an on-demand
# Configuration.Provider initialization race (switching BlickApplication.onCreate to an
# explicit synchronous WorkManager.initialize() call first did not change the failure count),
# and a transitive dependency conflict (androidx.startup:startup-runtime and
# androidx.tracing:tracing resolve to the exact same versions at 2.9.1 and 2.11.2). The
# leading remaining suspect, not yet confirmed: 2.11.2's own changelog lists "Handle security
# exception in NetworkStateTracker" as a bug fix -- WorkManager's network-constraint tracker,
# plausible given Blick declares no ACCESS_NETWORK_STATE permission and instrumented test
# processes are a known source of ConnectivityManager SecurityExceptions on some devices/OS
# versions -- but no direct evidence (logcat has no NetworkStateTracker/SecurityException/
# ConnectivityManager line from Blick's own process) confirmed this before the investigation
# was stopped in favor of just staying on the last known-good patch, 2.11.1. Re-attempt 2.11.2
# (or whatever is newest by then) on a future pass, with this comment as the starting context.
work = "2.11.1"
hiltWork = "1.2.0"

# Home-screen widget milestone. 1.1.1 is the latest STABLE release per Google's Maven
# metadata (dl.google.com/android/maven2/androidx/glance/glance-appwidget/maven-metadata.xml,
# checked 2026-08-01) -- 1.2.x/1.3.x are alpha/beta/rc only. glance-appwidget transitively
# pulls in androidx.glance:glance (the base composable/Action APIs), so no separate
# top-level dependency entry is needed for that artifact.
glance = "1.1.1"

junit = "4.13.2"
androidxTestExtJunit = "1.2.1"
espressoCore = "3.6.1"
mockk = "1.13.13"
kotlinxCoroutinesTest = "1.9.0"
# Latest stable per github.com/robolectric/robolectric/releases as of 2026-07-30, added for
# RoutineNotificationBuilderTest (Part 3/7 of the ongoing-notification foundation milestone)
# to construct and assert on a REAL android.app.Notification in a plain JVM unit test rather
# than a second hand-rolled copy of its expected configuration. Robolectric 4.16+ requires
# JDK 21 specifically to run against `@Config(sdk = 36)` (this project's compileSdk/targetSdk)
# — since the whole toolchain here is pinned to JDK 17 (see compileOptions above and
# android/README.md), RoutineNotificationBuilderTest instead targets `@Config(sdk = [34])`
# (Android 14), which Robolectric 4.16.1 fully supports under JDK 17. API 34 also matches this
# repo's own documented connected-device verification target (a Lenovo TB350FU running
# Android 14), so this isn't an arbitrary downgrade.
robolectric = "4.16.1"

