<svg viewBox="0 0 760 900" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
  </defs>

  <rect width="760" height="900" fill="#ffffff"/>

  <!-- Box 1: User selects stop -->
  <rect x="230" y="20" width="300" height="70" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
  <text x="380" y="60" text-anchor="middle" font-size="18" fill="#0c4a6e">User selects stop</text>

  <line x1="380" y1="90" x2="380" y2="130" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Box 2: Select transport mode, line and direction -->
  <rect x="180" y="130" width="400" height="70" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
  <text x="380" y="170" text-anchor="middle" font-size="18" fill="#0c4a6e">Select transport mode, line and direction</text>

  <line x1="380" y1="200" x2="380" y2="240" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Box 3: Save routine -->
  <rect x="255" y="240" width="250" height="70" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
  <text x="380" y="280" text-anchor="middle" font-size="18" fill="#0c4a6e">Save routine</text>

  <line x1="380" y1="310" x2="380" y2="350" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!--
    Refresh loop while the routine is active: request -> filter -> show -> wait 30s -> repeat.
    Drawn as one straight-line sequence of four boxes so the cycle reads left-to-right in
    time, not as two parallel branches.
  -->

  <!-- Box 4: Backend requests SL Transport and SL Deviations -->
  <rect x="130" y="350" width="500" height="70" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="380" y="382" text-anchor="middle" font-size="17" fill="#14532d">Backend requests SL Transport</text>
  <text x="380" y="404" text-anchor="middle" font-size="17" fill="#14532d">and SL Deviations</text>

  <line x1="380" y1="420" x2="380" y2="460" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Box 5: Filter departures for saved routine -->
  <rect x="155" y="460" width="450" height="70" rx="10" fill="#fef9c3" stroke="#a16207" stroke-width="2"/>
  <text x="380" y="500" text-anchor="middle" font-size="17" fill="#713f12">Filter departures for saved routine</text>

  <line x1="380" y1="530" x2="380" y2="570" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Box 6: Show upcoming departures -->
  <rect x="205" y="570" width="350" height="70" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
  <text x="380" y="612" text-anchor="middle" font-size="18" fill="#0c4a6e">Show upcoming departures</text>

  <line x1="380" y1="640" x2="380" y2="680" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Box 7: Wait 30 seconds -->
  <rect x="255" y="680" width="250" height="70" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
  <text x="380" y="722" text-anchor="middle" font-size="18" fill="#7f1d1d">Wait 30 seconds</text>

  <!-- Loop back to Box 4: repeat while the routine is active -->
  <path d="M 505 715 C 690 715, 690 385, 635 385" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="662" y="550" text-anchor="middle" font-size="14" fill="#475569" transform="rotate(90 662 550)">repeat while routine is active</text>

  <!-- Footer note -->
  <text x="380" y="820" text-anchor="middle" font-size="13" fill="#64748b">Blick supports all SL transport modes (metro, bus, tram, train, ferry) for any saved routine —</text>
  <text x="380" y="840" text-anchor="middle" font-size="13" fill="#64748b">this diagram is mode-agnostic and applies regardless of which mode is selected.</text>
</svg>
